name: Terraform CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: arc-runner-set
    environment: ${{ inputs.environment }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        run: |
          curl -fsSL https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip \
            -o terraform.zip
          unzip terraform.zip
          sudo mv terraform /usr/local/bin/
          rm terraform.zip

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o "awscliv2.zip"
          unzip awscliv2.zip
          ./aws/install --install-dir $HOME/.aws-cli --bin-dir $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          rm -rf awscliv2.zip aws/

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region eu-west-3

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: envs/${{ inputs.environment }}
        run: terraform init -input=false

      - name: Check required secret
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
        run: |
          if [ -z "$TF_VAR_db_password" ]; then
            echo "Missing required secret: TF_VAR_db_password"
            exit 1
          fi

      - name: Terraform Plan
        working-directory: envs/${{ inputs.environment }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
        run: terraform plan -input=false -var="db_password=$TF_VAR_db_password"

      - name: Terraform Apply
        working-directory: envs/${{ inputs.environment }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
        run: terraform apply -auto-approve -var="db_password=$TF_VAR_db_password"
