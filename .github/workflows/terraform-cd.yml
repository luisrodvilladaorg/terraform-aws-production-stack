name: Terraform CD

on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Environment to deploy"
                required: true
                default: "dev"

jobs:
    terraform-apply:
        name: Terraform Apply
        runs-on: self-hosted

        defaults:
            run:
                shell: bash

        steps:
            # 1️⃣ Checkout repository
            - name: Checkout repository
              uses: actions/checkout@v4

            # 2️⃣ Setup Terraform
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.6.6

            # 3️⃣ Verify AWS identity (basic security check)
            - name: Verify AWS identity
              run: aws sts get-caller-identity

            # 4️⃣ Terraform Init
            - name: Terraform Init
              working-directory: envs/${{ inputs.environment }}
              run: terraform init -input=false

            # 4.1️⃣ Validate required secret
            - name: Check required secret
              env:
                TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
              run: |
                if [ -z "$TF_VAR_db_password" ]; then
                  echo "Missing required secret: TF_VAR_db_password"
                  exit 1
                fi

            # 4.2️⃣ Safe debug: confirm secret injection (no value output)
            - name: Debug secret presence
              env:
                TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
              run: |
                echo "TF_VAR_db_password is set. Length: ${#TF_VAR_db_password}"

            # 5️⃣ Terraform Plan (preview)
            - name: Terraform Plan
              working-directory: envs/${{ inputs.environment }}
              env:
                TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
              run: terraform plan -input=false -var="db_password=$TF_VAR_db_password"

            # 6️⃣ Terraform Apply (automatic, confirmed via workflow_dispatch)
            - name: Terraform Apply
              working-directory: envs/${{ inputs.environment }}
              env:
                TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
              run: terraform apply -auto-approve -var="db_password=$TF_VAR_db_password"
