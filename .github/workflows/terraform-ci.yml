name: Terraform CI - Validate Modules and Root

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-ci:
    name: Terraform CI Validation
    runs-on: arc-runner-set

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        run: |
          curl -fsSL https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip \
            -o terraform.zip
          unzip terraform.zip
          sudo mv terraform /usr/local/bin/
          rm terraform.zip
          terraform version

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o "awscliv2.zip"
          unzip awscliv2.zip
          ./aws/install --install-dir $HOME/.aws-cli --bin-dir $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          rm -rf awscliv2.zip aws/

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region eu-west-3

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --version

      - name: Run TFLint
        run: tflint --recursive

      - name: Validate Terraform modules
        run: |
          set -e
          for module in modules/*; do
            if [ -d "$module" ]; then
              echo "===================================="
              echo "Validating module: $module"
              echo "===================================="
              cd "$module"
              terraform init -backend=false -input=false
              terraform validate
              cd - > /dev/null
            fi
          done

      - name: Terraform init (envs/dev)
        working-directory: envs/dev
        run: terraform init -input=false

      - name: Terraform validate (envs/dev)
        working-directory: envs/dev
        run: terraform validate

      - name: Check required secret
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
        run: |
          if [ -z "$TF_VAR_db_password" ]; then
            echo "Missing required secret: TF_VAR_db_password"
            exit 1
          fi

      - name: Terraform plan (envs/dev)
        working-directory: envs/dev
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
        run: terraform plan -out=tfplan.binary -input=false -var="db_password=$TF_VAR_db_password"

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Terraform plan JSON
        working-directory: envs/dev
        run: terraform show -json tfplan.binary > plan.json

      - name: Generate Infracost breakdown
        run: |
          infracost breakdown --path envs/dev/plan.json \
            --format json \
            --out-file /tmp/infracost.json

      - name: Post Infracost comment
        if: github.event_name == 'pull_request'
        run: |
          infracost comment github --path /tmp/infracost.json \
            --repo ${{ github.repository }} \
            --pull-request ${{ github.event.pull_request.number }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --behavior update