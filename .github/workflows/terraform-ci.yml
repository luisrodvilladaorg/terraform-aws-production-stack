name: Terraform CI - Validate Modules and Root

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-ci:
    name: Terraform CI Validation
    runs-on: self-hosted

    defaults:
      run:
        shell: bash

    steps:
      # 1️⃣ Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install Terraform on the self-hosted runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # 3️⃣ Verify AWS identity (runner credentials)
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # =========================
      # FORMATO GLOBAL
      # =========================

      # 4️⃣ Verify Terraform code formatting across the repository
      - name: Terraform fmt (all)
        run: terraform fmt -check -recursive

      # =========================
      # TFLINT (LINTING AWS)
      # =========================

      # 5️⃣ Install TFLint on the runner
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      # 6️⃣ Run TFLint across the whole repository
      #     - Analyzes modules and root
      #     - Detects AWS bad practices
      #     - Fails the pipeline when errors are found
      - name: Run TFLint (recursive)
        run: tflint --recursive

      # =========================
      # MODULE VALIDATION
      # =========================

      # 7️⃣ Validate each Terraform module in isolation
      - name: Validate Terraform modules
        run: |
          set -e
          for module in modules/*; do
            if [ -d "$module" ]; then
              echo "===================================="
              echo "Validating module: $module"
              echo "===================================="
              cd "$module"
              terraform init -backend=false -input=false
              terraform validate
              cd - > /dev/null
            fi
          done

      # =========================
      # ROOT VALIDATION (envs/dev)
      # =========================

      # 8️⃣ Initialize Terraform in the dev environment
      - name: Terraform init (envs/dev)
        working-directory: envs/dev
        run: terraform init -backend=false -input=false

      # 9️⃣ Validate root module (envs/dev)
      - name: Terraform validate (envs/dev)
        working-directory: envs/dev
        run: terraform validate

      # 🔟 Generate the plan (without applying)
      - name: Terraform plan (envs/dev)
        working-directory: envs/dev
        env:
