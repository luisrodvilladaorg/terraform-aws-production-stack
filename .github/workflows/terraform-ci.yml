name: Terraform CI - Validate Modules and Root

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-ci:
    name: Terraform CI Validation
    runs-on: self-hosted

    defaults:
      run:
        shell: bash

    steps:
      # 1️⃣ Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Instalar Terraform en el runner self-hosted
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # 3️⃣ Verificar identidad AWS (credenciales del runner)
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # =========================
      # FORMATO GLOBAL
      # =========================

      # 4️⃣ Verifica que todo el código Terraform esté formateado correctamente
      - name: Terraform fmt (all)
        run: terraform fmt -check -recursive

      # =========================
      # TFLINT (LINTING AWS)
      # =========================

      # 5️⃣ Instala TFLint en el runner
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      # 6️⃣ Ejecuta TFLint en todo el repositorio
      #     - Analiza módulos y root
      #     - Detecta malas prácticas AWS
      #     - Falla el pipeline si encuentra errores
      - name: Run TFLint (recursive)
        run: tflint --recursive

      # =========================
      # VALIDACIÓN DE MÓDULOS
      # =========================

      # 7️⃣ Valida cada módulo Terraform de forma aislada
      - name: Validate Terraform modules
        run: |
          set -e
          for module in modules/*; do
            if [ -d "$module" ]; then
              echo "===================================="
              echo "Validating module: $module"
              echo "===================================="
              cd "$module"
              terraform init -backend=false -input=false
              terraform validate
              cd - > /dev/null
            fi
          done

      # =========================
      # VALIDACIÓN ROOT (envs/dev)
      # =========================

      # 8️⃣ Inicializa Terraform en el entorno dev
      - name: Terraform init (envs/dev)
        working-directory: envs/dev
        run: terraform init -input=false

      # 9️⃣ Valida el root module (envs/dev)
      - name: Terraform validate (envs/dev)
        working-directory: envs/dev
        run: terraform validate

      # 🔟 Genera el plan (sin aplicar)
      - name: Terraform plan (envs/dev)
        working-directory: envs/dev
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
        run: terraform plan -lock=false -out=tfplan.binary -input=false

      # =========================
      # INFRACOST - ESTIMACIÓN DE COSTOS
      # =========================

      # 1️⃣1️⃣ Instala Infracost CLI
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # 1️⃣2️⃣ Genera el plan legible para Infracost
      - name: Generate Terraform plan JSON
        working-directory: envs/dev
        run: terraform show -json tfplan.binary > plan.json

      # 1️⃣3️⃣ Genera el breakdown de costos
      - name: Generate Infracost cost estimate breakdown
        run: |
          infracost breakdown --path envs/dev/plan.json \
                              --format json \
                              --out-file /tmp/infracost.json

      # 1️⃣4️⃣ Publica el comentario con costos en el PR
      - name: Post Infracost comment
        if: github.event_name == 'pull_request'
        run: |
          infracost comment github --path /tmp/infracost.json \
                                   --repo ${{ github.repository }} \
                                   --pull-request ${{ github.event.pull_request.number }} \
                                   --github-token ${{ secrets.GITHUB_TOKEN }} \
                                   --behavior update
