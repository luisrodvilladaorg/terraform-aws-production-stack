      # =========================
      # INFRACOST - COST ESTIMATION
      # =========================

      # 1️⃣1️⃣ Install Infracost CLI
      - name: Setup Infracost
        if: env.INFRACOST_API_KEY != ''
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # 1️⃣2️⃣ Generate Terraform plan JSON for Infracost
      - name: Generate Terraform plan JSON
        if: env.INFRACOST_API_KEY != ''
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        working-directory: envs/dev
        run: terraform show -json tfplan.binary > plan.json

      # 1️⃣3️⃣ Generate cost breakdown
      - name: Generate Infracost cost estimate breakdown
        if: env.INFRACOST_API_KEY != ''
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown --path envs/dev/plan.json \
                              --format json \
                              --out-file /tmp/infracost.json

      # 1️⃣4️⃣ Post cost comment on the PR
      - name: Post Infracost comment
        if: github.event_name == 'pull_request' && env.INFRACOST_API_KEY != ''
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost comment github --path /tmp/infracost.json \
                                   --repo ${{ github.repository }} \
                                   --pull-request ${{ github.event.pull_request.number }} \
                                   --github-token ${{ secrets.GITHUB_TOKEN }} \
                                   --behavior update
