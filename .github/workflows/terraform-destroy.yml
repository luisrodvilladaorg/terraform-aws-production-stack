name: Terraform Destroy

on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Environment to destroy"
                required: true
                default: "dev"

jobs:
    terraform-destroy:
        name: Terraform Destroy
        runs-on: arc-runner-set

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.6.6

            - name: Verify AWS identity
              run: aws sts get-caller-identity

            - name: Terraform Init
              working-directory: envs/${{ inputs.environment }}
              run: terraform init -input=false

            - name: Validate environment input
              run: |
                if [ "${{ inputs.environment }}" != "dev" ] && [ "${{ inputs.environment }}" != "prod" ]; then
                  echo "Invalid environment: ${{ inputs.environment }}. Allowed: dev, prod"
                  exit 1
                fi

            - name: Check required secrets
              env:
                TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
              run: |
                if [ -z "$TF_VAR_db_password" ]; then
                  echo "Missing required secret: TF_VAR_db_password"
                  exit 1
                fi

            - name: Terraform Destroy
              working-directory: envs/${{ inputs.environment }}
              env:
                TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
              run: terraform destroy -auto-approve
